<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="main">
      <h4>WE'RE HERE TO HELP YOU</h4>
      <h2>
        <span>Discuss</span> 
        <span class="light-text">Your <br>Chemical Solution Needs</span>
      </h2>
      <p>Are you looking for top-quality chemical solutions tailored to your needs? Reach out to us.</p> 
      <div class="content">
        <div class="contact-row">
          <img src="./assets/email1.png" alt="Email">
          <span>E-mail: soluvent***@gmail.com</span>
        </div>
        <div class="contact-row">
          <img src="./assets/phone1.png" alt="Phone">
          <span>Phone number: +123-456-7890</span>
        </div>
      </div>
    </div>
    <div class="form-container">
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="sana yusra" required>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="yusra@gmail.com" required>
        <label for="industry">Industry</label>
        <select id="industry" required>
          <option value="">Select </option>
        </select>
        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Type your message here..."></textarea> 
        <button type="submit">➡ Get a Solution</button>
      </form>
    </div>
  </div>
</body>
</html>
